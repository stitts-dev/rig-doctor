[package]
name = "rig-doctor-globe"
version = "0.2.0"
description = "Live route globe: traces this machine's connections and ranks relay routes"
edition = "2021"
# Never published to crates.io. Also lets cargo deny skip the license check for this crate.
publish = false

[lib]
name = "rig_doctor_globe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sysinfo = "0.36"
dns-lookup = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"
maxminddb = { version = "0.32", features = ["mmap"] }
flate2 = "1"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
