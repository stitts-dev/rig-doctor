# cargo deny check: licenses every dependency may use, known advisories, and where crates come from.
# CI runs it in desktop-ci.yml (job deny).

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Vulnerabilities fail for any crate. "Unmaintained" notices fail only for crates this app depends
# on directly: the transitive ones today (proc-macro-error via gtk, zbus_names, zvariant,
# zvariant_derive via zbus) come from Tauri and have no upgrade until Tauri moves.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses, plus MPL-2.0 (file-level copyleft: fine unmodified; cssparser, selectors,
# dtoa-short, option-ext) and CDLA-Permissive-2.0 (webpki-roots' certificate data).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
# Tauri pulls several versions of some crates. Not worth failing on.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
