name: desktop-release
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: read

jobs:
  # Builds with a read-only token so dependency scripts cannot write to the repo.
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm tauri build --bundles msi,nsis

      - name: Check both installers exist
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          foreach ($p in "$bundle/msi/*.msi", "$bundle/nsis/*.exe") {
            if (-not (Test-Path $p)) { throw "Missing installer: $p" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: rig-doctor-globe-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Only tag pushes publish. This job runs no project code.
  release:
    needs: build-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rig-doctor-globe-windows
          path: installers

      - uses: softprops/action-gh-release@v2
        with:
          name: Rig Doctor Globe ${{ github.ref_name }}
          body: 'Windows installers: the .exe is the NSIS setup, the .msi is the Windows Installer package.'
          draft: true
          fail_on_unmatched_files: true
          files: |
            installers/**/*.msi
            installers/**/*.exe
