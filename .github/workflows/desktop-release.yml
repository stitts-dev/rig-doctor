name: desktop-release
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/desktop-version.mjs'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: read

jobs:
  # On a tag push, fails fast unless the tag is desktop-vX.Y.Z. Otherwise checks the files agree.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate tag / version files
        env:
          IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') }}
        run: |
          if [ "$IS_TAG" = true ]; then
            node scripts/desktop-version.mjs set "$GITHUB_REF_NAME"
          else
            node scripts/desktop-version.mjs check
          fi

  # Builds with a read-only token so dependency scripts cannot write to the repo.
  build-windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master: @stable is this commit plus a default toolchain
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: .
        run: node scripts/desktop-version.mjs set "${{ github.ref_name }}"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm tauri build --bundles msi,nsis

      - name: Check both installers exist
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          foreach ($p in "$bundle/msi/*.msi", "$bundle/nsis/*.exe") {
            if (-not (Test-Path $p)) { throw "Missing installer: $p" }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rig-doctor-globe-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Signs with a Developer ID and notarizes on tag pushes and manual runs once the six APPLE_*
  # repo secrets exist. Pull requests, and runs without the secrets, build unsigned.
  build-macos:
    needs: version
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master: @stable is this commit plus a default toolchain
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            desktop/src-tauri -> target
            desktop/mac-helper -> target

      - name: Set version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: .
        run: node scripts/desktop-version.mjs set "${{ github.ref_name }}"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Tauri treats a set-but-empty APPLE_CERTIFICATE as "sign", so the APPLE_* variables are
      # exported only when this build signs.
      - name: Sign this build?
        id: sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              d="EOF_$RANDOM$RANDOM"
              printf '%s<<%s\n%s\n%s\n' "$v" "$d" "${!v}" "$d" >> "$GITHUB_ENV"
            done
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Building unsigned (pull request, or APPLE_CERTIFICATE secret not set)."
          fi

      # Tauri bundles it as Contents/MacOS/rig-doctor-helper and signs it with the app.
      - name: Build privileged helper
        working-directory: desktop/mac-helper
        run: |
          cargo build --release --locked
          mkdir -p ../src-tauri/binaries
          cp target/release/rig-doctor-helper ../src-tauri/binaries/rig-doctor-helper-aarch64-apple-darwin

      # `app` too, or Tauri deletes the .app after making the dmg and the checks below have nothing to read.
      # With APPLE_CERTIFICATE set, Tauri imports it into a temporary keychain, signs with the
      # hardened runtime, notarizes with the Apple ID, and staples the ticket to the app.
      - name: Build dmg
        run: pnpm tauri build --bundles app,dmg --config src-tauri/tauri.helper.conf.json

      - name: Check the dmg and the bundled helper
        run: |
          ls src-tauri/target/release/bundle/dmg/*.dmg
          app="src-tauri/target/release/bundle/macos/Rig Doctor Globe.app"
          test -x "$app/Contents/MacOS/rig-doctor-helper"
          plutil -lint "$app/Contents/Library/LaunchDaemons/dev.jaden.rigdoctor.globe.helper.plist"

      - name: Check signature and notarization
        if: steps.sign.outputs.signed == 'true'
        run: |
          app="src-tauri/target/release/bundle/macos/Rig Doctor Globe.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app/Contents/MacOS/rig-doctor-helper" 2>&1 | grep -E "TeamIdentifier=[A-Z0-9]{10}"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rig-doctor-globe-macos
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Only tag pushes publish. This job runs no project code.
  release:
    needs: [build-windows, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for desktop/release-notes. Checkout goes first because it empties a workspace that
      # is not a git repository yet, which would delete the downloaded installers.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: desktop/release-notes
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rig-doctor-globe-*
          path: installers

      # desktop/release-notes/X.Y.Z.md for this tag when it exists, then the install notes.
      - name: Release notes
        env:
          INSTALL: |
            Windows: the .exe is the NSIS setup, the .msi is the Windows Installer package.

            ${{ needs.build-macos.outputs.signed == 'true' && 'macOS (Apple Silicon): the .dmg holds a signed, notarized app. Drag it to Applications. The first relay On asks you to allow Rig Doctor Globe under System Settings > General > Login Items once; after that On and Off never ask for a password.' || 'macOS (Apple Silicon): the .dmg is unsigned. After copying the app to Applications, run `xattr -cr "/Applications/Rig Doctor Globe.app"` once before opening it.' }}
        run: |
          notes="desktop/release-notes/${GITHUB_REF_NAME#desktop-v}.md"
          {
            if [ -f "$notes" ]; then cat "$notes"; printf '\n## Install\n\n'; fi
            printf '%s' "$INSTALL"
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Rig Doctor Globe ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: true
          fail_on_unmatched_files: true
          files: |
            installers/**/*.msi
            installers/**/*.exe
            installers/**/*.dmg
