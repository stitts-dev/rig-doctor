name: desktop-release
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/desktop-version.mjs'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: read

jobs:
  # On a tag push, fails fast unless the tag is desktop-vX.Y.Z. Otherwise checks the files agree.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag / version files
        env:
          IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') }}
        run: |
          if [ "$IS_TAG" = true ]; then
            node scripts/desktop-version.mjs set "$GITHUB_REF_NAME"
          else
            node scripts/desktop-version.mjs check
          fi

  # Builds with a read-only token so dependency scripts cannot write to the repo.
  build-windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: .
        run: node scripts/desktop-version.mjs set "${{ github.ref_name }}"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm tauri build --bundles msi,nsis

      - name: Check both installers exist
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          foreach ($p in "$bundle/msi/*.msi", "$bundle/nsis/*.exe") {
            if (-not (Test-Path $p)) { throw "Missing installer: $p" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: rig-doctor-globe-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    needs: version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: .
        run: node scripts/desktop-version.mjs set "${{ github.ref_name }}"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Unsigned, like Windows. Apple Silicon build from macos-latest.
      - name: Build dmg
        run: pnpm tauri build --bundles dmg

      - name: Check dmg exists
        run: ls src-tauri/target/release/bundle/dmg/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: rig-doctor-globe-macos
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Only tag pushes publish. This job runs no project code.
  release:
    needs: [build-windows, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rig-doctor-globe-*
          path: installers

      - uses: softprops/action-gh-release@v2
        with:
          name: Rig Doctor Globe ${{ github.ref_name }}
          body: |
            Windows: the .exe is the NSIS setup, the .msi is the Windows Installer package.
            macOS (Apple Silicon): the .dmg is unsigned. After copying the app to Applications, run `xattr -cr "/Applications/Rig Doctor Globe.app"` once before opening it.
          draft: true
          fail_on_unmatched_files: true
          files: |
            installers/**/*.msi
            installers/**/*.exe
            installers/**/*.dmg
