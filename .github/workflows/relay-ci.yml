name: relay-ci
on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - 'tests/relay/**'
      - '.github/workflows/relay-ci.yml'
  pull_request:
    paths:
      - 'relay/**'
      - 'tests/relay/**'
      - '.github/workflows/relay-ci.yml'

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -x relay/*.sh tests/relay/*.sh

      - name: Relay API tests
        run: sudo python3 -I tests/relay/test_api.py

      - name: End-to-end relay test (network namespaces)
        run: sudo tests/relay/e2e.sh
