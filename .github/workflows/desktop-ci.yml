name: desktop-ci
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/desktop-version.mjs'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/desktop-version.mjs'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  # package.json, tauri.conf.json, Cargo.toml and Cargo.lock must carry the same version.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/desktop-version.mjs check

  # Dependency licenses, crate sources and known advisories (desktop/src-tauri/deny.toml).
  # A new advisory can land at any time, so that check reports without blocking unrelated PRs.
  deny:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks: [advisories, 'licenses bans sources']
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: desktop/src-tauri/Cargo.toml
          command: check ${{ matrix.checks }}

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # The installers bundle this file, so it must list today's dependencies.
      - name: Third-party notices are current
        run: node ../scripts/third-party-notices.mjs --check

      # Type-checks, bundles, and parses the CSP from tauri.conf.json (vite.config.ts).
      - name: Build frontend
        run: pnpm build

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --locked

      # Playwright is a QA-only tool, so it stays out of the app's lockfile.
      - name: Install Playwright
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y >/dev/null
          npm i playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: No-overlap check
        env:
          NODE_PATH: ${{ runner.temp }}/node_modules
        run: |
          pnpm dev > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:1420/ >/dev/null && break; sleep 1; done
          node qa/overlap-check.cjs "$RUNNER_TEMP/overlap"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: overlap-check
          path: |
            ${{ runner.temp }}/overlap
            ${{ runner.temp }}/vite.log
          if-no-files-found: ignore

  # macOS live data: unit tests, then the real lsof/traceroute/ping/plutil against loopback.
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! needs the built frontend.
      - name: Build frontend
        run: pnpm build

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Live OS tools on loopback
        working-directory: desktop/src-tauri
        run: cargo test --locked live_os -- --ignored

      # The root helper behind On/Off without a password prompt (desktop/mac-helper).
      - name: Privileged helper tests and build
        working-directory: desktop/mac-helper
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked

  # Windows is the main target: unit tests (sc state, icacls, the UAC setup script, tracert and
  # netstat parsing), then the real ping/tracert/netstat against loopback.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! needs the built frontend.
      - name: Build frontend
        run: pnpm build

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Live OS tools on loopback
        working-directory: desktop/src-tauri
        run: cargo test --locked live_os -- --ignored
